<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Homepage Video Inspector</title>
  <style>
    body { background: #0c0b0b; color: #fff; font-family: sans-serif; padding: 20px; }
    #videoContainer { margin-bottom: 20px; }
    video { width: 100%; max-width: 1200px; border: 2px solid #444; border-radius: 8px; }
    .controls { margin: 15px 0; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    button { padding: 6px 12px; cursor: pointer; background: #222; color: #d4af37; border: 1px solid #d4af37; border-radius: 4px; font-weight: bold; }
    button:hover { background: #d4af37; color: #000; }
    #timeDisplay { font-size: 16px; margin-left: 10px; color: #aaa; }
    .frames-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 15px; margin-top: 20px; }
    .frame-card { background: #1a1919; border: 1px solid #333; padding: 8px; border-radius: 6px; }
    .frame-card h4 { margin: 0 0 6px 0; color: #d4af37; font-size: 13px; }
    .frame-card canvas { width: 100%; height: auto; border: 1px solid #444; border-radius: 4px; }
  </style>
</head>
<body>
  <h2>Reference Screen Recording Inspector: references/homepage.mp4</h2>
  <div class="controls">
    <button onclick="seek(0)">0s</button>
    <button onclick="seek(2)">2s</button>
    <button onclick="seek(5)">5s</button>
    <button onclick="seek(8)">8s</button>
    <button onclick="seek(12)">12s</button>
    <button onclick="seek(16)">16s</button>
    <button onclick="seek(20)">20s</button>
    <button onclick="seek(25)">25s</button>
    <button onclick="seek(30)">30s</button>
    <button onclick="seek(35)">35s</button>
    <button onclick="seek(40)">40s</button>
    <button onclick="seek(45)">45s</button>
    <button onclick="seek(50)">50s</button>
    <button onclick="seek(55)">55s</button>
    <button onclick="seek(60)">60s</button>
    <button onclick="captureAll()">Capture Frames Sequence</button>
    <span id="timeDisplay">0.0s</span>
  </div>

  <div id="videoContainer">
    <video id="v" src="/reference-homepage.mp4" controls muted playsinline></video>
  </div>

  <h3>Captured Keyframes</h3>
  <div id="framesGrid" class="frames-grid"></div>

  <script>
    const v = document.getElementById('v');
    const td = document.getElementById('timeDisplay');
    const grid = document.getElementById('framesGrid');

    v.ontimeupdate = () => {
      td.textContent = v.currentTime.toFixed(1) + 's / ' + (v.duration ? v.duration.toFixed(1) : 0) + 's';
    };

    function seek(t) {
      v.currentTime = t;
    }

    async function captureFrameAt(timeSec) {
      return new Promise((resolve) => {
        v.currentTime = timeSec;
        v.onseeked = () => {
          const card = document.createElement('div');
          card.className = 'frame-card';
          const title = document.createElement('h4');
          title.textContent = `Timestamp: ${timeSec.toFixed(1)}s`;
          const canvas = document.createElement('canvas');
          canvas.width = v.videoWidth || 1280;
          canvas.height = v.videoHeight || 720;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(v, 0, 0, canvas.width, canvas.height);
          card.appendChild(title);
          card.appendChild(canvas);
          grid.appendChild(card);
          resolve();
        };
      });
    }

    async function captureAll() {
      grid.innerHTML = '';
      const duration = v.duration || 60;
      const step = Math.max(2, duration / 15);
      for (let t = 0; t <= duration; t += step) {
        await captureFrameAt(t);
      }
      document.body.setAttribute('data-capture-done', 'true');
    }

    v.onloadedmetadata = () => {
      console.log('Video loaded. Duration:', v.duration, 'Size:', v.videoWidth, 'x', v.videoHeight);
    };
  </script>
</body>
</html>
